# ============================================
#           DATABASE CONFIGURATION
# ============================================

# PostgreSQL Connection
database.driver=org.postgresql.Driver
database.url=jdbc:postgresql://localhost:5432/wb_cars
database.username=postgres
database.password=postgres

# Connection Pool Settings
database.initialSize=5
database.maxActive=20
database.maxIdle=10
database.minIdle=5
database.maxWait=30000

# ============================================
#           HIBERNATE CONFIGURATION
# ============================================

# Hibernate Settings
hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
hibernate.hbm2ddl.auto=update
hibernate.show_sql=true
hibernate.format_sql=true
hibernate.jdbc.batch_size=25
hibernate.order_inserts=true
hibernate.order_updates=true
hibernate.jdbc.batch_versioned_data=true

# Cache Settings
hibernate.cache.use_second_level_cache=true
hibernate.cache.use_query_cache=true
hibernate.cache.region.factory_class=org.hibernate.cache.ehcache.EhCacheRegionFactory

# ============================================
#           APPLICATION CONFIGURATION
# ============================================

# Application Settings
app.name=WB Cars System
app.version=2.0.0
app.environment=development
app.upload.path=uploads/
app.upload.maxSize=10485760
app.encoding=UTF-8

# JSF Settings
jsf.project.stage=Development
jsf.state.saving.method=server
jsf.facelets.suffix=.xhtml

# PrimeFaces Settings
primefaces.theme=nova-light
primefaces.font.awesome=true