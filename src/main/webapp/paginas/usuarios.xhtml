<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <f:facet name="first">
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>WB Cars - Usuários</title>
    </f:facet>
    
    <!-- Custom CSS com parâmetro para evitar cache -->
    <h:outputStylesheet library="css" name="wbcars.css">
        <f:param name="v" value="#{java.time.LocalDateTime.now().toEpochSecond(java.time.ZoneOffset.UTC)}"/>
    </h:outputStylesheet>
</h:head>

<h:body styleClass="dashboard-container">
    <!-- Verificação de autenticação -->
    <f:event type="preRenderView" listener="#{usuariosBean.headerBean.verificarLogin()}"/>
    
    <!-- Inicialização do bean da página -->
    <f:event type="preRenderView" listener="#{usuariosBean.init()}"/>
    
    <!-- Header componentizado -->
    <ui:include src="/componentes/header.xhtml"/>
    
    <!-- Título da página -->
    <h1 style="text-align: center; margin: 20px 0;">👤 Usuários</h1>
    
</h:body>
</html>
