<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <f:facet name="first">
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>WB Cars - Dashboard</title>
    </f:facet>
    
    <!-- Custom CSS com parâmetro para evitar cache -->
    <h:outputStylesheet library="css" name="wbcars.css">
        <f:param name="v" value="#{java.time.LocalDateTime.now().toEpochSecond(java.time.ZoneOffset.UTC)}"/>
    </h:outputStylesheet>
    
   
</h:head>

<h:body styleClass="dashboard-container">
    <!-- Verificação de autenticação -->
    <f:event type="preRenderView" listener="#{loginBean.verificarLogin()}"/>
    
    <!-- Inicialização do bean da página -->
    <f:event type="preRenderView" listener="#{dashboardBean.init()}"/>
    
    <!-- Header componentizado -->
    <ui:include src="/componentes/header.xhtml"/>
    
    <!-- Painel de Boas-vindas -->
    <p:panel styleClass="welcome-panel">
        <h:outputText value="🎉 Bem-vindo ao Sistema WB Cars!" style="color: #667eea; margin-bottom: 15px; font-size: 24px; font-weight: 700;"/>
        <h:outputText value="Sistema integrado de gestão automotiva com segurança avançada" 
                     style="font-size: 18px; color: #666; margin-bottom: 10px; display: block;"/>
        <h:outputText value="Usuário Logado: #{loginBean.nomeFuncionario} | Perfil: #{loginBean.perfilFuncionario} | Data/Hora: " 
                     style="color: #888; display: inline;"/>
        <h:outputText value="#{java.time.LocalDateTime.now()}" style="color: #888;">
            <f:convertDateTime pattern="dd/MM/yyyy HH:mm"/>
        </h:outputText>
    </p:panel>
    
    <!-- Cards de Estatísticas -->
    <p:panelGrid columns="4" styleClass="stats-container" layout="grid">
        <p:panel styleClass="stat-card">
            <h:outputText value="🚗" styleClass="stat-icon"/>
            <h:outputText value="0" styleClass="stat-number"/>
            <h:outputText value="Veículos Cadastrados" styleClass="stat-label"/>
        </p:panel>
        
        <p:panel styleClass="stat-card">
            <h:outputText value="👥" styleClass="stat-icon"/>
            <h:outputText value="0" styleClass="stat-number"/>
            <h:outputText value="Clientes Ativos" styleClass="stat-label"/>
        </p:panel>
        
        <p:panel styleClass="stat-card">
            <h:outputText value="🔧" styleClass="stat-icon"/>
            <h:outputText value="0" styleClass="stat-number"/>
            <h:outputText value="Ordens de Serviço" styleClass="stat-label"/>
        </p:panel>
        
        <p:panel styleClass="stat-card">
            <h:outputText value="💰" styleClass="stat-icon"/>
            <h:outputText value="R$ 0,00" styleClass="stat-number"/>
            <h:outputText value="Faturamento Mensal" styleClass="stat-label"/>
        </p:panel>
    </p:panelGrid>
    
    <!-- Painel de Ações Rápidas -->
    <p:panel styleClass="actions-panel">
        <h:outputText value="🚀 Ações Rápidas" styleClass="actions-title"/>
        
        <h:form>
            <p:panelGrid columns="3" styleClass="actions-grid" layout="grid">
                <p:commandButton value="📋 Novo Cliente" 
                               styleClass="action-button ui-button-success"
                               icon="pi pi-user-plus"/>
                
                <p:commandButton value="🔧 Nova Ordem Serviço" 
                               styleClass="action-button ui-button-info"
                               icon="pi pi-wrench"/>
                
                <p:commandButton value="🚗 Cadastrar Veículo" 
                               styleClass="action-button ui-button-warning"
                               icon="pi pi-car"/>
                
                <p:commandButton value="📊 Relatórios" 
                               styleClass="action-button ui-button-secondary"
                               icon="pi pi-chart-bar"/>
                
                <p:commandButton value="📦 Estoque" 
                               styleClass="action-button ui-button-help"
                               icon="pi pi-box"/>
                
                <p:commandButton value="⚙️ Configurações" 
                               styleClass="action-button"
                               icon="pi pi-cog"/>
            </p:panelGrid>
        </h:form>
    </p:panel>
    
    <!-- Mensagens do Sistema -->
    <p:messages id="messages" showDetail="true" closable="true" autoUpdate="true"/>
    
</h:body>
</html>
