<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<ui:composition>
    <!-- Header do Dashboard -->
    <div class="dashboard-header">
        <!-- Título à esquerda -->
        <h1 class="dashboard-title">🚗 WB Cars - Sistema de Gestão</h1>
        
        <!-- Menu no centro -->
        <div class="dashboard-menu-form">
            <h:form>
                <p:menubar styleClass="dashboard-menu">
                    <p:submenu label="📋 Cadastros" icon="pi pi-file">
                        <p:menuitem value="🚗 Veículos" icon="pi pi-car" action="#{headerBean.navegarVeiculos}"/>
                        <p:menuitem value="👥 Clientes" icon="pi pi-users" action="#{headerBean.navegarClientes}"/>
                        <p:menuitem value="👤 Funcionários" icon="pi pi-user" action="#{headerBean.navegarFuncionarios}"/>
                        <p:menuitem value="🏭 Fornecedores" icon="pi pi-building" action="#{headerBean.navegarFornecedores}"/>
                        <p:menuitem value="📦 Produtos" icon="pi pi-box" action="#{headerBean.navegarProdutos}"/>
                        <p:menuitem value="🏙️ Cidades" icon="pi pi-map" action="#{headerBean.navegarCidades}"/>
                        <p:menuitem value="📏 Unidades" icon="pi pi-calculator" action="#{headerBean.navegarUnidades}"/>
                        <p:menuitem value="👤 Usuários" icon="pi pi-user-plus" action="#{headerBean.navegarUsuarios}"/>
                    </p:submenu>
                    
                    <p:submenu label="⚙️ Operações" icon="pi pi-cog">
                        <p:menuitem value="🏠 Início" icon="pi pi-home" action="#{headerBean.navegarInicio}"/>
                        <p:menuitem value="📅 Agendamentos" icon="pi pi-calendar" action="#{headerBean.navegarAgendamentos}"/>
                        <p:menuitem value="🔧 OS" icon="pi pi-wrench" action="#{headerBean.navegarOS}"/>
                        <p:menuitem value="📄 Orçamentos" icon="pi pi-file" action="#{headerBean.navegarOrcamentos}"/>
                        <p:menuitem value="💰 Vendas" icon="pi pi-shopping-cart" action="#{headerBean.navegarVendas}"/>
                        <p:menuitem value="📦 Estoque" icon="pi pi-inbox" action="#{headerBean.navegarEstoque}"/>
                    </p:submenu>
                    
                    <p:submenu label="💰 Financeiro" icon="pi pi-dollar">
                        <p:menuitem value="💳 Contas a Pagar" icon="pi pi-credit-card" action="#{headerBean.navegarContasPagar}"/>
                        <p:menuitem value="📊 Relatórios" icon="pi pi-chart-bar" action="#{headerBean.navegarRelatorios}"/>
                        <p:menuitem value="📈 Rel. Detalhados" icon="pi pi-chart-line" action="#{headerBean.navegarRelDetalhados}"/>
                    </p:submenu>
                </p:menubar>
            </h:form>
        </div>
        
        <!-- Informações do usuário e botão sair à direita -->
        <div class="user-section">
            <div class="user-info">
                <div style="font-weight: bold;">#{headerBean.nomeFuncionario}</div>
                <div style="font-size: 14px;">#{headerBean.perfilFuncionario}</div>
            </div>
            
            <h:form>
                <p:commandButton value="Sair" 
                               action="#{headerBean.logout}"
                               styleClass="logout-btn"
                               icon="pi pi-sign-out"
                               immediate="true"/>
            </h:form>
        </div>
    </div>
</ui:composition>

</html>
