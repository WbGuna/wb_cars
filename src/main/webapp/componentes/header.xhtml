<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<ui:composition>
    <!-- Header do Dashboard -->
    <div class="dashboard-header">
        <!-- Título à esquerda -->
        <h1 class="dashboard-title">🚗 WB Cars - Sistema de Gestão</h1>
        
        <!-- Menu no centro -->
        <div class="dashboard-menu-form">
            <h:form>
                <p:menubar styleClass="dashboard-menu">
                    <p:submenu label="📋 Cadastros" icon="pi pi-file">
                        <p:menuitem value="🚗 Veículos" icon="pi pi-car"/>
                        <p:menuitem value="👥 Clientes" icon="pi pi-users"/>
                        <p:menuitem value="👤 Funcionários" icon="pi pi-user"/>
                        <p:menuitem value="🏭 Fornecedores" icon="pi pi-building"/>
                        <p:menuitem value="📦 Produtos" icon="pi pi-box"/>
                        <p:menuitem value="🏙️ Cidades" icon="pi pi-map"/>
                        <p:menuitem value="📏 Unidades" icon="pi pi-calculator"/>
                        <p:menuitem value="👤 Usuários" icon="pi pi-user-plus"/>
                    </p:submenu>
                    
                    <p:submenu label="⚙️ Operações" icon="pi pi-cog">
                        <p:menuitem value="📅 Agendamentos" icon="pi pi-calendar"/>
                        <p:menuitem value="🔧 OS" icon="pi pi-wrench"/>
                        <p:menuitem value="📄 Orçamentos" icon="pi pi-file"/>
                        <p:menuitem value="💰 Vendas" icon="pi pi-shopping-cart"/>
                        <p:menuitem value="📦 Estoque" icon="pi pi-inbox"/>
                    </p:submenu>
                    
                    <p:submenu label="💰 Financeiro" icon="pi pi-dollar">
                        <p:menuitem value="💳 Contas a Pagar" icon="pi pi-credit-card"/>
                        <p:menuitem value="📊 Relatórios" icon="pi pi-chart-bar"/>
                        <p:menuitem value="📈 Rel. Detalhados" icon="pi pi-chart-line"/>
                    </p:submenu>
                </p:menubar>
            </h:form>
        </div>
        
        <!-- Informações do usuário e botão sair à direita -->
        <div class="user-section">
            <div class="user-info">
                <div style="font-weight: bold;">#{loginBean.nomeFuncionario}</div>
                <div style="font-size: 14px;">#{loginBean.perfilFuncionario}</div>
            </div>
            
            <h:form>
                <p:commandButton value="Sair" 
                               action="#{loginBean.logout()}"
                               styleClass="logout-btn"
                               icon="pi pi-sign-out"
                               immediate="true"/>
            </h:form>
        </div>
    </div>
</ui:composition>

</html>
