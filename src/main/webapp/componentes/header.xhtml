<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<ui:composition>
    <!-- Header do Dashboard -->
    <div class="dashboard-header">
        <!-- Título à esquerda -->
        <h1 class="dashboard-title">🚗 WB Cars - Sistema de Gestão</h1>
        
        <!-- Menu no centro -->
        <div class="dashboard-menu-form">
            <h:form>
                <p:menubar styleClass="dashboard-menu">
                    <p:submenu label="📋 Cadastros">
                        <p:menuitem value="🚗 Veículos" outcome="/paginas/veiculos"/>
                        <p:menuitem value="👥 Clientes" outcome="/paginas/clientes"/>
                        <p:menuitem value="👤 Funcionários" outcome="/paginas/funcionarios"/>
                        <p:menuitem value="🏭 Fornecedores" outcome="/paginas/fornecedores"/>
                        <p:menuitem value="📦 Produtos" outcome="/paginas/produtos"/>
                        <p:menuitem value="🏙️ Cidades"  outcome="/paginas/cidades"/>
                        <p:menuitem value="📏 Unidades" outcome="/paginas/unidades"/>
                        <p:menuitem value="👤 Usuários" outcome="/paginas/usuarios"/>
                    </p:submenu>
                    
                    <p:submenu label="⚙️ Operações">
                        <p:menuitem value="🏠 Início" outcome="/dashboard"/>
                        <p:menuitem value="📅 Agendamentos" outcome="/paginas/agendamentos"/>
                        <p:menuitem value="🔧 OS" outcome="/paginas/ordemDeServico"/>
                        <p:menuitem value="📄 Orçamentos" outcome="/paginas/orcamentos"/>
                        <p:menuitem value="💰 Vendas" outcome="/paginas/vendas"/>
                        <p:menuitem value="📦 Estoque" outcome="/paginas/estoque"/>
                    </p:submenu>
                    
                    <p:submenu label="💰 Financeiro">
                        <p:menuitem value="💳 Contas a Pagar" outcome="/paginas/contasPagar"/>
                        <p:menuitem value="📊 Relatórios" outcome="/paginas/relatorios"/>
                        <p:menuitem value="📈 Rel. Detalhados" outcome="/paginas/relDetalhados"/>
                    </p:submenu>
                </p:menubar>
            </h:form>
        </div>
        
        <!-- Informações do usuário e botão sair à direita -->
        <div class="user-section">
            <div class="user-info">
                <div style="font-weight: bold;">#{headerBean.nomeFuncionario}</div>
                <div style="font-size: 14px;">#{headerBean.perfilFuncionario}</div>
            </div>
            
            <h:form>
                <p:commandButton value="Sair" 
                               action="#{headerBean.logout()}"
                               styleClass="logout-btn"
                               icon="pi pi-sign-out"
                               immediate="true"
                               ajax="false"/>
            </h:form>
        </div>
    </div>
</ui:composition>

</html>
