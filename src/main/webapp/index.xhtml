<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<f:metadata>
    <f:event type="preRenderView" listener="#{loginBean.init}" />
</f:metadata>

<h:head>
    <title>WB Cars - Sistema de Gestão Automotiva</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="UTF-8" />
    <h:outputStylesheet library="css" name="wbcars.css">
        <f:param name="v" value="#{java.time.LocalDateTime.now().toEpochSecond(java.time.ZoneOffset.UTC)}"/>
    </h:outputStylesheet>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</h:head>
<h:body styleClass="login-body">
    <div class="login-container">
        <div class="login-panel">
            <div class="login-logo">
                <i class="fas fa-car" style="font-size: 5rem; color: #0056b3;"></i>
            </div>
            
            <h1 class="login-title">WB Cars</h1>
            <p class="login-subtitle">Sistema de Gestão Automotiva</p>
            
            <h:form styleClass="login-form">
                <p:growl id="messages" showDetail="true" />
                
                <div class="login-field">
                    <p:outputLabel for="username" value="Usuário:" />
                    <p:inputText id="username" value="#{loginBean.username}" 
                              required="true" requiredMessage="Usuário é obrigatório"
                              placeholder="Digite seu usuário"
                              autocomplete="off">
                        <f:validateLength minimum="3" />
                    </p:inputText>
                    <p:message for="username" display="text" />
                </div>
                
                <div class="login-field">
                    <p:outputLabel for="password" value="Senha:" />
                    <p:password id="password" value="#{loginBean.password}" 
                             required="true" requiredMessage="Senha é obrigatória"
                             placeholder="Digite sua senha"
                             feedback="false"
                             toggleMask="true">
                        <f:validateLength minimum="4" />
                    </p:password>
                    <p:message for="password" display="text" />
                </div>
                
                <div class="login-actions">
                    <p:commandButton value="ENTRAR" action="#{loginBean.login}"
                                   update="messages"
                                   icon="fas fa-sign-in-alt"
                                   styleClass="login-button ui-button-primary" />
                </div>
            </h:form>
            
            <div class="login-footer">
                <p>© #{java.time.Year.now().getValue()} WB Cars. Todos os direitos reservados.</p>
                <p>Para suporte técnico, entre em contato com o administrador do sistema.</p>
            </div>
            
            <div class="login-version">
                Versão 1.2.0 - Setembro/2025
            </div>
        </div>
    </div>
</h:body>
</html>
